apiVersion: batch/v1
kind: CronJob
metadata: { name: collab-account-backup, namespace: collab }
spec:
  schedule: "17 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels: { app: collab }
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: backup
              image: cr.yandex/crp2ssdjqlmvih5cgc2o/collab:2.6.0
              command: [node, backup.mjs]
              resources:
                requests: { cpu: 10m, memory: 64Mi }
                limits: { cpu: 250m, memory: 256Mi }
              env:
                - { name: ACCOUNT_DIR, value: /data/accounts }
                - { name: S3_ENDPOINT, value: "https://storage.yandexcloud.net" }
                - { name: S3_BUCKET, valueFrom: { secretKeyRef: { name: collab-secrets, key: S3_BUCKET } } }
                - { name: S3_ACCESS_KEY, valueFrom: { secretKeyRef: { name: collab-secrets, key: S3_ACCESS_KEY } } }
                - { name: S3_SECRET_KEY, valueFrom: { secretKeyRef: { name: collab-secrets, key: S3_SECRET_KEY } } }
              volumeMounts:
                - { name: data, mountPath: /data, readOnly: true }
          volumes:
            - name: data
              persistentVolumeClaim: { claimName: collab-accounts }
