apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: collab-accounts, namespace: collab }
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 1Gi }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: collab-redis, namespace: collab }
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 4Gi }
